{% extends "base.html" %}
{% block title %}Find Recommendations - SmartCourse{% endblock %}

{% block content %}
<style>
    .search-area {
        background: white;
        border-radius: 24px;
        border: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: var(--card-shadow);
    }

    .model-header {
        padding: 1rem;
        border-radius: 12px;
        margin-bottom: 1.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 0.85rem;
    }

    .tfidf-header { background: #eef2ff; color: #4361ee; border: 1px solid #dee2ff; }
    .neural-header { background: #f5f3ff; color: #7209b7; border: 1px solid #e0dbff; }

    .result-card {
        background: white;
        border-radius: 16px;
        border: 1px solid #f1f5f9;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .result-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.05);
        border-color: #cbd5e1;
    }

    .progress {
        height: 6px;
        background-color: #f1f5f9;
        border-radius: 10px;
    }

    .progress-bar-tfidf { background: linear-gradient(90deg, #4361ee, #4cc9f0); }
    .progress-bar-neural { background: linear-gradient(90deg, #7209b7, #b5179e); }

    .score-text { font-weight: 700; font-size: 0.9rem; }
    
    #query {
        border-radius: 15px;
        padding: 1.5rem;
        border: 2px solid #f1f5f9;
        transition: border-color 0.3s;
    }

    #query:focus {
        border-color: var(--brand-primary);
        box-shadow: none;
    }

    .btn-analyze {
        background: var(--brand-gradient);
        border: none;
        padding: 1rem 2rem;
        border-radius: 12px;
        font-weight: 700;
        transition: transform 0.2s;
    }

    .btn-analyze:hover {
        transform: scale(1.02);
        box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
    }
</style>

<div class="row justify-content-center">
    <div class="col-lg-11">
        
        <div class="search-area p-4 p-md-5 mb-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold">What's your next learning goal?</h2>
                <p class="text-muted">Enter your preferences below to see how our dual AI engines process your intent.</p>
            </div>

            <div class="mb-4">
                <textarea id="query" class="form-control form-control-lg" rows="3" 
                          placeholder="e.g., I want to learn Python for data science and visualization"></textarea>
            </div>

            <div class="text-center">
                <button id="analyzeBtn" class="btn btn-primary btn-lg btn-analyze px-5">
                    <i class="fas fa-bolt me-2"></i> Analyze & Compare Results
                </button>
            </div>
        </div>

        <div id="resultsSection" style="display:none;">
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="model-header tfidf-header text-center">
                        <i class="fas fa-font me-2"></i> TF-IDF: Keyword Matching
                    </div>
                    <div id="tfidfResults"></div>
                </div>

                <div class="col-md-6">
                    <div class="model-header neural-header text-center">
                        <i class="fas fa-brain me-2"></i> Neural: Semantic Understanding
                    </div>
                    <div id="neuralResults"></div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
document.getElementById('analyzeBtn').addEventListener('click', function () {
    const query = document.getElementById('query').value.trim();

    if (!query) {
        alert("Please describe what you want to learn!");
        return;
    }

    const btn = this;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing Models...';

    fetch('/api/recommend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('resultsSection').style.display = 'block';
        
        renderResults('tfidfResults', data.tfidf, 'tfidf', query, 'progress-bar-tfidf');
        renderResults('neuralResults', data.neural, 'neural', query, 'progress-bar-neural');

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-bolt me-2"></i> Analyze & Compare Results';
        
        // Smooth scroll to results
        document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    })
    .catch(err => {
        alert("Error fetching recommendations.");
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-bolt me-2"></i> Analyze & Compare Results';
    });
});

function renderResults(containerId, results, model, query, barClass) {
    let html = '';

    if (!results || results.length === 0) {
        html = '<div class="text-center p-5 text-muted">No specific matches found.</div>';
    } else {
        results.forEach(course => {
            html += `
            <div class="card result-card mb-4 p-4">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h5 class="fw-bold text-dark mb-0 pe-3">${course.title}</h5>
                    <span class="score-text ${model === 'tfidf' ? 'text-primary' : 'text-purple'}" style="color: ${model === 'neural' ? '#7209b7' : ''}">${course.score}%</span>
                </div>
                
                <p class="text-muted small mb-3" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                    ${course.description}
                </p>

                <div class="progress mb-4">
                    <div class="progress-bar ${barClass}" role="progressbar" style="width: ${course.score}%"></div>
                </div>

                <button class="btn btn-sm btn-light border w-100 fw-bold rounded-pill" 
                    onclick="saveCourse(${course.course_id}, '${course.title.replace(/'/g, "\\'")}', '${query.replace(/'/g, "\\'")}', '${model}', this)">
                    <i class="far fa-bookmark me-1"></i> Save Recommendation
                </button>
            </div>`;
        });
    }

    document.getElementById(containerId).innerHTML = html;
}

function saveCourse(id, title, query, model, btn) {
    btn.disabled = true;
    const originalHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

    fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            course_id: id,
            title: title,
            query: query,
            model: model
        })
    })
    .then(res => res.json())
    .then(data => {
        btn.innerHTML = '<i class="fas fa-check me-1"></i> Saved to Dashboard';
        btn.classList.remove('btn-light', 'border');
        btn.classList.add('btn-success', 'text-white');
    })
    .catch(() => {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
    });
}
</script>
{% endblock %}
